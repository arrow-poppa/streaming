name: Desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ios-ux-0.9.94
    paths:
      - .github/workflows/desktop-build.yml
      - src/**
      - src-tauri/**
      - harbor-core/**
      - public/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.html
      - tsconfig*.json
      - vite.config.ts

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - name: Linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libmpv-dev libgtk-3-dev libxdo-dev libfuse2t64 patchelf xz-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Read the pnpm version from package.json (pnpm 11 requires Node >=22).
      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: desktop-${{ matrix.platform.target }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test update configuration
        run: node scripts/test-updater-unconfigured.mjs

      - name: Test shared core
        working-directory: harbor-core
        run: cargo test --locked --all-targets

      - name: Fetch video sidecars
        env:
          HARBOR_FFMPEG_URL: ${{ matrix.platform.ffmpeg }}
          HARBOR_FFPROBE_URL: ${{ matrix.platform.ffmpeg }}
        run: node scripts/fetch-binaries.mjs

      - name: Fetch verified subtitle fonts
        run: pnpm setup:fonts

      # Harbor's old mpvdll release no longer exists. Use matching upstream
      # player/dev archives, with verified SHA256 hashes, for the x64 build.
      - name: Fetch Windows mpv and libmpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261015'
          $archives = @(
            @{
              Name = 'mpv-dev-x86_64-20261015-git-492bae0768.7z'
              Sha256 = '5db58c1768587b35f2d8daa11b53de4aec58197c00ea1d676f998f183a358ba8'
              File = 'libmpv-2.dll'
              Destination = 'src-tauri/libmpv/libmpv-2.dll'
            },
            @{
              Name = 'mpv-x86_64-20261015-git-492bae0768.7z'
              Sha256 = 'f9becefe40e2a29d2ce5f3ab231ff094f9cf3e4038ff014cfe4a0c09ad90e79e'
              File = 'mpv.exe'
              Destination = 'src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe'
            }
          )
          foreach ($archive in $archives) {
            $downloadPath = Join-Path $env:RUNNER_TEMP $archive.Name
            $extractPath = "$downloadPath-extracted"
            curl.exe --fail --location --retry 3 "$base/$($archive.Name)" --output $downloadPath
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($archive.Name)" }
            if ((Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash -ne $archive.Sha256) {
              throw "Checksum mismatch: $($archive.Name)"
            }
            & 7z x -y $downloadPath "-o$extractPath"
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $($archive.Name)" }
            $binary = @(Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter $archive.File)
            if ($binary.Count -ne 1) { throw "Expected exactly one $($archive.File)" }
            Copy-Item -LiteralPath $binary[0].FullName -Destination $archive.Destination
          }

      - name: Build desktop installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --ci --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-0.9.94-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

